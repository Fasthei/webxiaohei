  <g fill="#e6d0af"><circle cx="1" cy="-20" r="2"/><circle cx="15" cy="-14" r="2"/><circle cx="22" cy="3" r="2"/><circle cx="12" cy="18" r="2"/><circle cx="-9" cy="20" r="2"/><circle cx="-21" cy="-5" r="2"/><circle cx="-13" cy="-17" r="2"/></g>
 </g>
