<svg xmlns="http://www.w3.org/2000/svg" width="850" height="900" viewBox="0 0 850 900" fill="none">
<title>Spring returns</title><desc>An original botanical drawing: pale flowers opening on an enduring branch, against the circles of the seasons.</desc>
