name: Publish Markdown articles
on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/publish-content.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-markdown-content
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Test parser
        run: python3 -m unittest discover -s tests -v
      - name: Generate and publish article index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/build_posts.py
            git add content/site.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Make newly pushed Markdown available to website readers' -m 'Tested: Markdown parser tests and content generation' -m 'Scope-risk: narrow'
            if git push origin HEAD:main; then exit 0; fi
          done
          echo 'Could not publish content after three attempts' >&2
          exit 1
